# SPECTRE report generator (paper, Appendix "Implementation details").
# Visual features are frozen; LoRA adapters and the visual-to-text projector are trained.
backbone: SPECTRE
decoder: Qwen/Qwen2.5-0.5B
visual_weights: pretrained

diagnostic_loss:
  lambda_pos: 0.01
  lambda_neg: 0.005
  tau: 8.0

lora:
  rank: 16
  alpha: 32
  dropout: 0.05
  target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
